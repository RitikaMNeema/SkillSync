name: Application Service Tests

on:
  push:
    paths:
      - 'services/application_service/**'
      - 'shared/**'
      - '.github/workflows/test-application-service.yml'
  pull_request:
    paths:
      - 'services/application_service/**'
      - 'shared/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/application_service/requirements.txt

      - name: Install dependencies
        run: pip install -r services/application_service/requirements.txt

      - name: Run tests
        working-directory: services/application_service
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ -v
