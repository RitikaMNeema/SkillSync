name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-job-service:
    name: Job Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/job_service/requirements.txt
      - run: pip install -r services/job_service/requirements.txt
      - name: Run tests
        working-directory: services/job_service
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ -v

  test-application-service:
    name: Application Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/application_service/requirements.txt
      - run: pip install -r services/application_service/requirements.txt
      - name: Run tests
        working-directory: services/application_service
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ -v

  test-messaging-service:
    name: Messaging Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/messaging_service/requirements.txt
      - run: pip install -r services/messaging_service/requirements.txt
      - name: Run tests
        working-directory: services/messaging_service
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ -v
