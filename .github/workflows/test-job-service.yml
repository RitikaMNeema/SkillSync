name: Job Service Tests

on:
  push:
    paths:
      - 'backend/services/job_service/**'
      - 'backend/shared/**'
      - '.github/workflows/test-job-service.yml'
  pull_request:
    paths:
      - 'backend/services/job_service/**'
      - 'backend/shared/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/services/job_service/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/services/job_service/requirements.txt

      - name: Run tests
        working-directory: backend/services/job_service
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest tests/ -v
