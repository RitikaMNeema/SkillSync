# When app services run in Compose, point at in-network infra
x-docker-runtime-env: &docker-runtime-env
  REDIS_HOST: redis
  REDIS_PORT: 6379
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  # Keep app DB creds aligned with mysql service interpolation (.env/--env-file/defaults),
  # instead of values from container-only env_file overlays.
  MYSQL_DATABASE: ${MYSQL_DATABASE:-linkedin_db}
  MYSQL_USER: ${MYSQL_USER:-linkedin_user}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme_app}
  # Defaults align with `.env.example` so `docker compose up` works without copying to `.env`;
  # `env_file` does not substitute variables in this YAML (only PROJECT/.env / --env-file / shell).
  MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-changeme_mongo}@mongo:27017/linkedin_db?authSource=admin
# Never commit `.env.local` — it holds your stable machine secrets across branch switches.
# Use `make bootstrap` once (copies `.env.example` → `.env.local`), then `make up`.
x-app-env-files: &app-env-files
  - .env.example
  - path: .env
    required: false
  - path: .env.local
    required: false

services:
  # ── Infrastructure ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: linkedin_mysql
    restart: unless-stopped
    env_file: *app-env-files
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-linkedin_db}
      MYSQL_USER: ${MYSQL_USER:-linkedin_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme_app}
    # Same host ports as typical Docker DBs (e.g. Yelp): Workbench -> localhost:3306
    # Stop other stacks using 3306/27017 before starting SkillSync (only one listener per port).
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  # init.sql only runs on empty mysql_data; existing volumes may lack newer ENUM values.
  # This one-shot extends applications.status with 'hired' when missing (idempotent).
  mysql-ensure-hired-enum:
    image: mysql:8.0
    container_name: linkedin_mysql_ensure_hired_enum
    restart: "no"
    env_file: *app-env-files
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-linkedin_db}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # Mount the whole folder so Docker never tries to bind-mount a host *directory*
      # that was accidentally created with the .sql name (file-vs-dir mount error).
      - ./database/mysql/migrations:/migrations:ro
      - ./database/mysql/ensure-hired-enum.sh:/ensure-hired-enum.sh:ro
    entrypoint: ["/bin/sh", "/ensure-hired-enum.sh"]

  mongo:
    image: mongo:7.0
    container_name: linkedin_mongo
    restart: unless-stopped
    env_file: *app-env-files
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-changeme_mongo}
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
      - ./database/mongodb/init.js:/docker-entrypoint-initdb.d/init.js
    # Use CMD-SHELL so credentials come from the container env (reliable with .env).
    # If this stays unhealthy, the mongo_data volume may be from an older run with
    # different auth: `docker compose down -v` (wipes DBs) then `docker compose up -d`.
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "${MONGO_INITDB_ROOT_USERNAME:-admin}",
          "-p",
          "${MONGO_INITDB_ROOT_PASSWORD:-changeme_mongo}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  # Applies database/mongodb/init.js on every `docker compose up`.
  # The mongo image only runs /docker-entrypoint-initdb.d/ when /data/db is empty;
  # this one-shot job keeps linkedin_db + indexes in sync for existing volumes.
  mongo-init:
    image: mongo:7.0
    container_name: linkedin_mongo_init_docker
    depends_on:
      mongo:
        condition: service_healthy
    env_file: *app-env-files
    environment:
      MONGO_HOST: mongo
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-changeme_mongo}
    volumes:
      - ./database/mongodb/init.js:/init.js:ro
      - ./database/mongodb/apply-init.sh:/apply-init.sh:ro
    entrypoint: ["/bin/sh", "/apply-init.sh"]
    restart: "no"

  redis:
    image: redis:7.2-alpine
    container_name: linkedin_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: linkedin_kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://127.0.0.1:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9094:9093"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Optional: seed MySQL/Mongo on the host (Homebrew). Not used by default app stack.
  mysql-init-host:
    profiles: ["host-db"]
    image: mysql:8.0
    container_name: linkedin_mysql_init_host
    restart: "no"
    env_file: *app-env-files
    volumes:
      - ./database/mysql/init.sql:/init.sql:ro
    command: >-
      sh -c 'until mysqladmin ping -hhost.docker.internal -P3306 -uroot -p$$MYSQL_ROOT_PASSWORD --silent; do echo "waiting for local mysql..."; sleep 2; done;
      mysql -hhost.docker.internal -P3306 -uroot -p$$MYSQL_ROOT_PASSWORD -e "CREATE DATABASE IF NOT EXISTS linkedin_db;";
      mysql --force -hhost.docker.internal -P3306 -uroot -p$$MYSQL_ROOT_PASSWORD linkedin_db < /init.sql'

  mongo-init-host:
    profiles: ["host-db"]
    image: mongo:7.0
    container_name: linkedin_mongo_init_host
    restart: "no"
    volumes:
      - ./database/mongodb/init.js:/init.js:ro
    command: >-
      sh -c 'until mongosh --host host.docker.internal --port 27017 --eval "db.adminCommand({ ping: 1 })" >/dev/null 2>&1; do echo "waiting for local mongo..."; sleep 2; done;
      mongosh --host host.docker.internal --port 27017 /init.js'

  # ── Services ─────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    container_name: linkedin_auth
    restart: unless-stopped
    env_file: *app-env-files
    environment:
      PORT: ${AUTH_SERVICE_PORT:-3001}
      PYTHONPATH: /app
      <<: *docker-runtime-env
    ports:
      - "${AUTH_SERVICE_PORT:-3001}:${AUTH_SERVICE_PORT:-3001}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${AUTH_SERVICE_PORT:-3001}/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  profile-service:
    build:
      context: .
      dockerfile: services/profile_service/Dockerfile
    container_name: linkedin_profile
    restart: unless-stopped
    env_file: *app-env-files
    environment:
      PORT: ${PROFILE_SERVICE_PORT:-3002}
      PYTHONPATH: /app
      <<: *docker-runtime-env
    ports:
      - "${PROFILE_SERVICE_PORT:-3002}:${PROFILE_SERVICE_PORT:-3002}"
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${PROFILE_SERVICE_PORT:-3002}/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  recruiter-service:
    build:
      context: .
      dockerfile: services/recruiter_service/Dockerfile
    container_name: linkedin_recruiter
    restart: unless-stopped
    env_file: *app-env-files
    environment:
      PORT: ${RECRUITER_SERVICE_PORT:-3003}
      PYTHONPATH: /app
      <<: *docker-runtime-env
    ports:
      - "${RECRUITER_SERVICE_PORT:-3003}:${RECRUITER_SERVICE_PORT:-3003}"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${RECRUITER_SERVICE_PORT:-3003}/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  connection-service:
    build:
      context: .
      dockerfile: services/connection_service/Dockerfile
    container_name: linkedin_connection
    restart: unless-stopped
    env_file: *app-env-files
    environment:
      PORT: ${CONNECTION_SERVICE_PORT:-3004}
      PYTHONPATH: /app
      <<: *docker-runtime-env
    ports:
      - "${CONNECTION_SERVICE_PORT:-3004}:${CONNECTION_SERVICE_PORT:-3004}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${CONNECTION_SERVICE_PORT:-3004}/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  job-service:
    build:
      context: .
      dockerfile: services/job_service/Dockerfile
    container_name: linkedin_job
    restart: unless-stopped
    env_file: *app-env-files
    environment:
      PORT: ${JOB_SERVICE_PORT:-3005}
      PYTHONPATH: /app
      <<: *docker-runtime-env
    ports:
      - "${JOB_SERVICE_PORT:-3005}:${JOB_SERVICE_PORT:-3005}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${JOB_SERVICE_PORT:-3005}/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  application-service:
    build:
      context: .
      dockerfile: services/application_service/Dockerfile
    container_name: linkedin_application
    restart: unless-stopped
    env_file: *app-env-files
    environment:
      PORT: ${APPLICATION_SERVICE_PORT:-3006}
      PYTHONPATH: /app
      <<: *docker-runtime-env
    ports:
      - "${APPLICATION_SERVICE_PORT:-3006}:${APPLICATION_SERVICE_PORT:-3006}"
    depends_on:
      mysql:
        condition: service_healthy
      mysql-ensure-hired-enum:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${APPLICATION_SERVICE_PORT:-3006}/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  messaging-service:
    build:
      context: .
      dockerfile: services/messaging_service/Dockerfile
    container_name: linkedin_messaging
    restart: unless-stopped
    env_file: *app-env-files
    environment:
      PORT: ${MESSAGING_SERVICE_PORT:-3007}
      PYTHONPATH: /app
      <<: *docker-runtime-env
    ports:
      - "${MESSAGING_SERVICE_PORT:-3007}:${MESSAGING_SERVICE_PORT:-3007}"
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${MESSAGING_SERVICE_PORT:-3007}/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics_service/Dockerfile
    container_name: linkedin_analytics
    restart: unless-stopped
    env_file: *app-env-files
    environment:
      PORT: ${ANALYTICS_SERVICE_PORT:-3008}
      PYTHONPATH: /app
      <<: *docker-runtime-env
    ports:
      - "${ANALYTICS_SERVICE_PORT:-3008}:${ANALYTICS_SERVICE_PORT:-3008}"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${ANALYTICS_SERVICE_PORT:-3008}/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  network-service:
    build:
      context: .
      dockerfile: services/network_service/Dockerfile
    container_name: linkedin_network
    restart: unless-stopped
    env_file: *app-env-files
    environment:
      PORT: ${NETWORK_SERVICE_PORT:-3009}
      PYTHONPATH: /app
      <<: *docker-runtime-env
    ports:
      - "${NETWORK_SERVICE_PORT:-3009}:${NETWORK_SERVICE_PORT:-3009}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${NETWORK_SERVICE_PORT:-3009}/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ai-service:
    build:
      context: .
      dockerfile: services/ai_service/Dockerfile
    container_name: linkedin_ai
    restart: unless-stopped
    env_file: *app-env-files
    environment:
      PORT: ${AI_SERVICE_PORT:-3010}
      PYTHONPATH: /app
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/api}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text:latest}
    ports:
      - "${AI_SERVICE_PORT:-3010}:${AI_SERVICE_PORT:-3010}"
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      profile-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
      recruiter-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${AI_SERVICE_PORT:-3010}/ai/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
      


volumes:
  mysql_data:
  mongo_data:
  redis_data:
  kafka_data: